# Render deployment config - Smart Computers Panel (Firebase-only Edition v12.0)
# No database needed! Data is stored in Firebase Firestore via the in-process firebase-admin SDK.
#
# DATA PROTECTION (built-in, always on):
#   - DELETE = soft-delete (rows marked deleted=true, never removed)
#   - replaceAll = permanently blocked
#   - Schema migration = data-safe (appends columns, never clears)
#
# PIN PROTECTION (optional, set APP_PIN to enable):
#   - 4-digit numeric PIN required to access the panel
#   - Set APP_PIN in Render dashboard (DO NOT commit it)

services:
  - type: web
    name: smart-computers-panel
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: .
    # IMPORTANT: Use npm with --include=dev for tailwindcss build deps
    buildCommand: npm install --include=dev && npm run build
    # Use the standalone server directly — `next start` does NOT work with
    # output: 'standalone' (Next.js 15 logs a warning and routes can misbehave).
    # The standalone bundle includes only the production deps needed to run,
    # so it boots faster and uses less memory than `next start`.
    startCommand: node .next/standalone/server.js
    # /api/health is public and returns live diagnostics — better health check
    # than '/' which requires PIN cookie and would always 302 to /login when
    # APP_PIN is set, causing Render to mark the service as unhealthy.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: "10000"
      # REQUIRED: Set this in Render dashboard to your Firebase service-account
      # JSON, base64-encoded (run `base64 -w0 service-account.json`).
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      # OPTIONAL BUT RECOMMENDED: 4-digit PIN to lock the panel.
      # When set, ALL /api/* routes (except public ones in proxy.ts) require
      # the smartcomp_auth cookie issued by /api/auth/login.
      # ALSO: this PIN is checked by the Next.js server (proxy.ts) for defense-in-depth.
      - key: APP_PIN
        sync: false
      # REQUIRED IN PROD if you use the corresponding webhooks/crons:
      - key: CRON_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: WA_APP_SECRET
        sync: false
      # OPTIONAL: WhatsApp Cloud API — enables auto-send + auto-capture replies.
      # If these are NOT set, the app falls back to wa.me manual mode.
      # v12.4: When these ARE set, the WhatsApp "Share" button on Invoices /
      # Quotations / Service Invoices delivers the PDF DIRECTLY to the
      # customer's WhatsApp as a document message (no manual attach needed).
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_BUSINESS_NUMBER
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_TEMPLATE_NAME
        value: "rate_enquiry"
      # OPTIONAL: WeasyPrint binary path on the server. When set, the
      # PDF download / WhatsApp-share uses the SAME HTML engine as the
      # on-screen preview (pixel-perfect match). Without it, falls back
      # to the old jsPDF engine (still works, looks slightly different).
      # Install on Render: pip install weasyprint
      - key: WEASYPRINT_BIN
        sync: false
      # OPTIONAL: public base URL of the deployed app (used in track URLs etc.)
      - key: NEXT_PUBLIC_BASE_URL
        sync: false

# Note: No database service needed!
# All data is stored in your Firebase Firestore database.
#
# Node version is auto-detected from .nvmrc file (set to 20.11.0)
# and package.json engines field (node: 20.x)
